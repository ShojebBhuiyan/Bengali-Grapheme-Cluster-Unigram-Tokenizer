[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer-bn"
version = "0.1.0"
description = "Bengali grapheme-cluster unigram tokenizer research package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.66,<5.0",
    "sentencepiece>=0.2.0,<0.3.0",
    "regex>=2024.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "transformers>=4.40.0,<5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0", "jupyter>=1.0,<2.0"]
gpu = ["torch>=2.0.0"]

[project.scripts]
tokenizer-bn = "tokenizer_bn.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
