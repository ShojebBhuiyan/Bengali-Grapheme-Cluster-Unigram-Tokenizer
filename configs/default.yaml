# Bengali Grapheme-Cluster Unigram Tokenizer — default configuration

paths:
  datasets_dir: datasets
  processed_dir: data/processed
  models_dir: models
  logs_dir: logs
  checkpoints_dir: checkpoints
  results_dir: results

# Default training run configuration
# corpus:
#   # Target size for the processed Bangla training corpus (bytes).
#   # The 9 GB bn.txt is sampled down to this limit; other sources are included up to the remainder.
#   corpus_sample_bytes: 9000000000 # 9 GB
#   min_bangla_ratio: 0.5 # minimum fraction of Bengali script chars to keep a line
#   dedup: true
#   normalize_nfc: true
#   shard_size_lines: 50000

# training:
#   vocab_size: 8000 # target; auto-reduced per variant if corpus cannot support it
#   max_sentence_length: 4192
#   character_coverage: 0.9995
#   input_sentence_size: 300000 # subsample for tractable SP training (recommended by SentencePiece)
#   seed: 42
#   num_threads: 4

# evaluation:
#   eval_sample_lines: 5000
#   strr_word_list_size: 1000
#   corpus_eval_max_lines: 0 # 0 = full corpus; set e.g. 50000 for faster runs
#   corpus_eval_batch_size: 512

# eda:
#   sample_lines: 50000
#   top_n_aksharas: 30

# device:
#   use_gpu: true # use GPU for eval/EDA aggregation when available
#   device: auto # auto, cpu, cuda, mps
#   batch_size: 256 # batch size for GPU metric computation

# Full training run configuration
corpus:
  corpus_sample_bytes: 9000000000 # build from full bn.txt (~9 GB)
  min_bangla_ratio: 0.5
  dedup: true
  normalize_nfc: true
  shard_size_lines: 50000

training:
  vocab_size: 32000 # raise if you want paper-scale vocab
  input_sentence_size: 5000000 # large enough to cover full built corpus
  num_threads: 8
  seed: 42

evaluation:
  eval_sample_lines: 50000 # larger sample for parity/STRR
  corpus_eval_max_lines: 0 # full corpus token metrics
  corpus_eval_batch_size: 1024

eda:
  sample_lines: 200000

device:
  use_gpu: true
  device: auto
  batch_size: 512
