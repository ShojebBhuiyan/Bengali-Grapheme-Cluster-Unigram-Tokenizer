# Bengali Grapheme-Cluster Unigram Tokenizer — default configuration

paths:
  datasets_dir: datasets
  processed_dir: data/processed
  models_dir: models
  logs_dir: logs
  checkpoints_dir: checkpoints
  results_dir: results

# Default training run configuration
# The corpus is built exclusively from the pure Bangla source (datasets/bangla/bn.txt).
# corpus:
#   # Byte budget for the processed Bangla corpus; bn.txt is truncated to this limit.
#   corpus_sample_bytes: 9000000000 # 9 GB
#   min_bangla_ratio: 0.5 # minimum fraction of Bengali script chars to keep a line
#   dedup: true
#   normalize_nfc: true
#   shard_size_lines: 50000

# training:
#   vocab_size: 8000 # target vocab per variant
#   max_sentence_length: 4192
#   character_coverage: 0.9995 # grapheme variants override this to 1.0 (finite akshara alphabet)
#   input_sentence_size: 300000 # SP training subsample; 0 (or negative) = use every sentence
#   unlimited_sentence_soft_cap: 5000000 # single subsample fallback when sharding disabled
#   shard_sentences: 5000000 # when unlimited, train full corpus in sequential shards of this size
#   seed: 42
#   num_threads: 4
#   min_vocab_ratio: 0.9 # fail if a variant's vocab collapses below this fraction of target

# evaluation:
#   eval_sample_lines: 5000
#   strr_word_list_size: 1000
#   corpus_eval_max_lines: 0 # 0 = full corpus; set e.g. 50000 for faster runs
#   corpus_eval_batch_size: 512

# eda:
#   sample_lines: 50000
#   top_n_aksharas: 30

# device:
#   use_gpu: true # use GPU for eval/EDA aggregation when available
#   device: auto # auto, cpu, cuda, mps
#   batch_size: 256 # batch size for GPU metric computation

# Full training run configuration (pure Bangla corpus)
corpus:
  corpus_sample_bytes: 9000000000 # build from full bn.txt (~9 GB)
  min_bangla_ratio: 0.5
  dedup: true
  normalize_nfc: true
  shard_size_lines: 50000

training:
  vocab_size: 32000 # raise if you want paper-scale vocab
  input_sentence_size: 0 # 0 = unlimited; use shard_sentences below for full-corpus training
  unlimited_sentence_soft_cap: 5000000 # fallback single subsample when shard_sentences=0
  shard_sentences: 5000000 # sequential shards with vocab carry-over (~8 shards for 37M lines)
  num_threads: 8
  seed: 42
  min_vocab_ratio: 0.9 # fail loudly if any variant collapses below 90% of target

evaluation:
  eval_sample_lines: 50000 # larger sample for parity/STRR
  corpus_eval_max_lines: 0 # full corpus token metrics
  corpus_eval_batch_size: 1024

eda:
  sample_lines: 200000

device:
  use_gpu: true
  device: auto
  batch_size: 512
